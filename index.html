<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weathered | Your Personal Weather Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <style>
        /* Shared Design System based on Weathered Palette */
        :root {
            --bg-color: #FAFAFA; /* Lightest Gray */
            --text-main: #333333; /* Darkest Gray */
            --text-muted: #8E8E93; /* Medium Gray */
            --accent-green: #76C893; /* Pastel Green */
            --accent-lavender: #B5A6E5; /* Pastel Lavender */
            --font-stack: "Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Container for scalability */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* App Icon Styling */
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 27px; /* Apple's continuous curve approximation */
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
            object-fit: cover;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin: 0 0 2rem 0;
        }

        /* App Store Button */
        .app-store-btn {
            background-color: var(--text-main);
            color: #FFF;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .app-store-btn:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            padding: 2rem;
            font-size: 0.85rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--accent-lavender);
        }
    </style>
    <link rel="icon" href="AppIcon.jpg">
</head>
<body>

    <main class="container">
        <!-- EDIT HERE: Replace 'icon-placeholder.png' with the actual path to your app icon -->
        <img src="AppIcon.jpg" alt="Weathered App Icon" class="app-icon">
        
        <h1>Weathered</h1>
        <p class="subtitle">Your personal weather journal.</p>

        <!-- EDIT HERE: Replace '#' with your actual App Store Connect URL once generated -->
        <a href="#" class="app-store-btn">Download on the App Store</a>

        <h4>6. Contact</h4>
        <p>If you have any questions or concerns regarding this Privacy Policy, please contact the developer: Eloi Canals Pascual at eloi.canals.98@gmail.com.</p>
    </main>

    <footer>
        <a href="terms.html">Terms & Conditions</a>
        <a href="privacy.html">Privacy Policy</a>
    </footer>

</body>
</html>
